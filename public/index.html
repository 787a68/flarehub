<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="运行在 Cloudflare Workers 上的 GitHub、Docker 与 Hugging Face 边缘代理">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>FlareHub · GitHub、Docker 与 Hugging Face 加速</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
  <div class="orb orb-4"></div>
</div>

<header class="nav-glass">
  <div class="nav-inner">
    <a href="/" class="logo">
      <span class="logo-mark">F</span>
      <span class="logo-text">FlareHub</span>
    </a>
  </div>
</header>

<main class="content">

  <!-- Hero -->
  <section class="hero-glass">
    <h1 class="hero-title">GitHub · Docker · Hugging Face<br>边缘加速</h1>
    <p class="hero-sub">在资源地址前添加本站域名，通过全球边缘网络流式传输，高速访问。</p>
  </section>

  <!-- Converter -->
  <div class="card-glass">
    <div class="card-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    </div>
    <h2 class="card-heading">快速转换加速链接</h2>
    <p class="card-desc">支持 GitHub、Docker 官方下载及 Hugging Face 资源地址</p>
    <form id="proxyForm" novalidate>
      <div class="input-glass-wrap">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <input type="url" class="input-glass" id="githubLinkInput" placeholder="粘贴或输入资源链接，按回车转换。例如 https://github.com/787a68/flarehub" aria-label="上游资源地址" autocomplete="url">
        <button class="btn-glass btn-primary" id="pasteConvertButton" type="button">粘贴并转换</button>
      </div>
    </form>
    <div class="output-area hidden" id="githubOutput">
      <div class="output-glass" id="githubFormattedLink"></div>
      <div class="output-row">
        <button class="btn-glass btn-ghost" id="copyButton">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制链接
        </button>
        <button class="btn-glass btn-ghost" id="downloadButton">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          立即下载
        </button>
      </div>
    </div>
  </div>

  <!-- Access Policy -->
  <div class="card-glass">
    <div class="card-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    </div>
    <h2 class="card-heading">访问规则</h2>
    <p class="card-desc">白名单与黑名单对代理统一生效，黑名单优先。部署时通过 GH Variables 注入，部署后可在 CF 变量中覆盖。</p>
    <div class="policy-grid">
      <div class="policy-panel">
        <span class="policy-label">白名单</span>
        <div class="chips" id="whitelistChips" aria-live="polite"></div>
      </div>
      <div class="policy-panel">
        <span class="policy-label">黑名单</span>
        <div class="chips" id="blacklistChips" aria-live="polite"></div>
      </div>
    </div>
    <div class="policy-match">
      <span class="match-badge">匹配方式</span>
      <code id="policyMatchMode">关键词包含匹配，区分大小写</code>
    </div>
  </div>

  <!-- Usage -->
  <div class="card-glass">
    <div class="card-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
    </div>
    <h2 class="card-heading">使用说明</h2>
    <p class="card-desc">使用 "本站域名/上游主机/资源路径" 格式，完整 HTTPS 地址也可拼接在本站域名之后</p>
    <div class="example-grid" id="usageExamples"></div>
  </div>

</main>

<footer class="footer-glass">
  <a href="https://github.com/787a68/flarehub" target="_blank" rel="noopener">GitHub · FlareHub</a>
</footer>

<div class="toast-glass" id="toast"></div>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
