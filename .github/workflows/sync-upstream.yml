name: Sync Upstream

on:
  schedule:
    - cron: "6 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    if: vars.UPSTREAM_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ vars.UPSTREAM_REPOSITORY }}.git"
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            after=$(git rev-parse HEAD)
            if [ "$before" = "$after" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push changes
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: Report conflicts
        if: failure() && steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream sync requires manual conflict resolution';
            const body = 'The scheduled upstream sync encountered merge conflicts. Please resolve them manually before the next deployment.';
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!issues.some(issue => issue.title === title)) {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
