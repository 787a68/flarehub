name: Sync Upstream

on:
  schedule:
    - cron: "6 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/787a68/flarehub.git
          git fetch upstream main

      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          if git merge --no-edit upstream/main; then
            after=$(git rev-parse HEAD)
            if [ "$before" = "$after" ]; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Push changes
        if: steps.merge.outputs.changed == 'true'
        run: git push origin main

      - name: Create PR for conflicts
        if: failure()
        uses: peter-evans/create-pull-request@v7
        with:
          title: "Sync upstream (conflicts)"
          body: "Automated sync from upstream resulted in merge conflicts. Please resolve manually."
          branch: sync/upstream-conflicts
